name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm 11.25.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Generate a throwaway export signing key
        shell: bash
        run: |
          # Production builds require an Ed25519 key. This one lives only for
          # this job and never signs a real export.
          key=$(node -e 'const { generateKeyPairSync } = require("node:crypto"); const { privateKey } = generateKeyPairSync("ed25519"); process.stdout.write(Buffer.from(privateKey.export({ format: "pem", type: "pkcs8" })).toString("base64"))')
          echo "::add-mask::$key"
          echo "EXPORT_SIGNING_KEY=$key" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Dummy public values so the app's zod env validation passes in CI.
          # No real secrets or infrastructure are used for this build.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy00000000000000000000
          CLOXA_SITE_URL: http://localhost:3000
          SUPABASE_SECRET_KEY: dummy-ci-only
          AUTH_HASH_PEPPER: dummy-ci-only-pepper-000000000000000000
          FLOW_COOKIE_SECRET: dummy-ci-only-cookie-secret-0000000000000
          # Required in production builds; CI mirrors the Vercel deployment.
          CLOXA_PROXY_MODE: vercel
          # EXPORT_SIGNING_KEY comes from the step above.
          EXPORT_SIGNING_KEY_ID: ci-dummy
        run: pnpm build

      - name: Audit production dependencies
        timeout-minutes: 5
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: pnpm audit --prod --audit-level=high

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep the private schema off the API
        shell: bash
        run: |
          # Fail if [api] schemas in supabase/config.toml lists "private".
          if awk '/^\[/{in_api = ($0 == "[api]")} in_api && /^[[:space:]]*schemas[[:space:]]*=/' supabase/config.toml \
            | grep -q '"private"'; then
            echo "supabase/config.toml exposes the private schema through [api] schemas." >&2
            exit 1
          fi

      - name: Install pnpm 11.25.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.116.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Lint database
        run: supabase db lint --local --schema public,private --fail-on warning

      - name: Test database
        shell: bash
        run: |
          if compgen -G "supabase/tests/*.sql" > /dev/null; then
            supabase test db --local
          else
            echo "No supabase/tests/*.sql files found; skipping pgTAP suite."
          fi

      - name: Concurrency integration test
        run: pnpm db:integration

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
